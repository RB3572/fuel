# XcodeGen spec — `xcodegen generate` in this directory produces Fuel.xcodeproj.
#
# iOS 26 because the AI runs on device through the FoundationModels framework: no
# Gemini, no network round trip, no quota, and food photos never leave the phone.
#
# The HealthKit replication engine is shared with Health Logger by source rather than
# copied. Fuel talks to the same endpoint with the same protocol, so a second
# implementation would only be a second thing to keep correct.
name: Fuel
options:
  bundleIdPrefix: com.labloggercompany
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
targets:
  Fuel:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
      - path: ../HealthLogger/Sources/HealthKitCatalog.swift
      - path: ../HealthLogger/Sources/SyncEngine.swift
      - path: ../HealthLogger/Sources/SyncSink.swift
      - path: ../HealthLogger/Sources/SyncStore.swift
      - path: ../HealthLogger/Sources/FuelAPI.swift
      - path: ../HealthLogger/Sources/BackgroundSync.swift
      # Also compiled into the widget extension (FuelWidgets target below) — see that
      # file's header for why a Control's AppIntent needs to live in both.
      - path: ../FuelWidgets/Sources/FuelControlIntents.swift
    dependencies:
      - target: FuelWidgets
        embed: true
    # Shared explicitly, so adding the widget scheme above does not leave the app's own
    # scheme as an unshared local one.
    scheme: {}
    entitlements:
      path: Resources/Fuel.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin: [Default]
        # Shared with the widget extension: the app writes a snapshot here after every
        # sync and the widgets, which cannot sign in or read HealthKit themselves, read
        # it back.
        com.apple.security.application-groups: [group.com.labloggercompany.fuel]
        # Lets a Lock Screen / Control Center control open the app. Controls can only
        # open a universal link via OpenURLIntent — a custom fuel:// scheme silently
        # does nothing there, unlike the Home Screen widgets' widgetURL, which is a
        # different mechanism and handles fuel:// fine. fuel.rishib.com/open is that
        # universal link; see /.well-known/apple-app-site-association.
        com.apple.developer.associated-domains: [applinks:fuel.rishib.com]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Fuel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: >-
          Fuel reads your Apple Health data — activity, heart, sleep, body, vitals and
          workouts — so your dashboard reflects what you actually did today.
        NSHealthUpdateUsageDescription: >-
          Fuel only reads Health data; it never writes any. iOS requires this text to
          be present.
        NSCameraUsageDescription: >-
          Take a photo of a meal and Fuel identifies it and estimates its nutrition
          on device, without sending the picture anywhere.
        NSLocationWhenInUseUsageDescription: >-
          Fuel records where you eat so it can show your places heatmap. Location
          never leaves your Fuel account.
        # Google's iOS OAuth client. iOS clients have no secret — the whole design
        # assumes the client ID is public — so this ships in the app safely.
        GoogleClientID: 804091048275-1rdvu5hmflm6ald1t2ugvojeoi9s9jee.apps.googleusercontent.com
        CFBundleURLTypes:
          # Google redirects to the reversed client ID.
          - CFBundleURLName: com.labloggercompany.fuel.google
            CFBundleURLSchemes: [com.googleusercontent.apps.804091048275-1rdvu5hmflm6ald1t2ugvojeoi9s9jee]
          # fuel:// still carries the server-brokered fallback and Apple's return.
          - CFBundleURLName: com.labloggercompany.fuel.auth
            CFBundleURLSchemes: [fuel]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - com.labloggercompany.fuel.refresh
          - com.labloggercompany.fuel.fullsync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.labloggercompany.fuel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9VVDB6UALA
        CURRENT_PROJECT_VERSION: 30
        MARKETING_VERSION: "1.0"
        # Xcode's recommended settings, set here so `xcodegen generate` keeps them.
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        LOCALIZED_STRING_SYMBOL_GENERATION: YES

  # The Home Screen widgets. They render from the shared snapshot only — no network, no
  # HealthKit, no credentials in the extension.
  FuelWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ../FuelWidgets/Sources
      - path: Sources/WidgetShared.swift
    # Running a widget extension directly asks SpringBoard to show one widget, and it
    # refuses unless the scheme names which of the sixteen kinds it should be. Without
    # this, Run on the FuelWidgets scheme fails with SBAvocadoDebuggingController code 2.
    # Change the value to preview a different widget; Run the Fuel scheme to launch the
    # app normally.
    scheme:
      environmentVariables:
        _XCWidgetKind: FuelEnergyRings
    entitlements:
      path: ../FuelWidgets/FuelWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.labloggercompany.fuel]
    info:
      path: ../FuelWidgets/Info.plist
      properties:
        CFBundleDisplayName: Fuel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.labloggercompany.fuel.widgets
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9VVDB6UALA
        CURRENT_PROJECT_VERSION: 30
        MARKETING_VERSION: "1.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SKIP_INSTALL: YES
