# XcodeGen spec — `xcodegen generate` in this directory produces HealthLogger.xcodeproj.
# The project file is generated, not checked in, so diffs stay readable.
name: HealthLogger
options:
  bundleIdPrefix: com.labloggercompany
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  HealthLogger:
    type: application
    platform: iOS
    sources: [Sources, Resources/Assets.xcassets]
    entitlements:
      path: Resources/HealthLogger.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.healthkit.access: []
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Health Logger
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: >-
          Health Logger reads your Apple Health data — activity, heart, sleep, body,
          vitals, workouts and mobility — and securely syncs it to your private Fuel
          dashboard. Nothing is shared with anyone else.
        NSHealthUpdateUsageDescription: >-
          Health Logger only reads Health data; it never writes any. iOS requires this
          text to be present.
        # The app implements no encryption of its own: HTTPS comes from URLSession and
        # the token sits in the Keychain, both Apple's. Declaring it here means App Store
        # Connect stops asking the export-compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - com.labloggercompany.healthlogger.refresh
          - com.labloggercompany.healthlogger.fullsync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.labloggercompany.healthlogger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        CODE_SIGN_STYLE: Automatic
        # The LAB LOGGER INC. team that owns com.labloggercompany.healthlogger.
        # Without this, `xcodebuild archive` fails with "requires a development team".
        DEVELOPMENT_TEAM: 9VVDB6UALA
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: "1.0"
