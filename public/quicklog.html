<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Quick log · Fuel</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="stylesheet" href="/quicklog.css?v=20260801-1">
</head>
<body>
  <main class="ql" id="ql">
    <!-- The camera fills the screen; everything else floats over it. -->
    <video id="ql-video" class="ql-video" playsinline muted autoplay></video>
    <canvas id="ql-canvas" hidden></canvas>

    <div class="ql-top">
      <a class="ql-back" href="/" aria-label="Back to Fuel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </a>
      <span class="ql-title">Quick log</span>
      <button class="ql-flip" id="ql-flip" type="button" aria-label="Switch camera">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/><path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/><path d="m18 22-3-3 3-3"/><path d="m6 2 3 3-3 3"/></svg>
      </button>
    </div>

    <p class="ql-status" id="ql-status" role="status" aria-live="polite">Starting the camera…</p>

    <div class="ql-bottom">
      <button class="ql-shutter" id="ql-shutter" type="button" aria-label="Take a photo and log it" disabled>
        <span class="ql-shutter-ring"></span>
      </button>
      <p class="ql-hint" id="ql-hint">Point at your food and tap to log it</p>
    </div>

    <!-- Shown while the photo is being read, so the wait is never a blank screen. -->
    <div class="ql-busy" id="ql-busy" hidden>
      <span class="ql-spinner" aria-hidden="true"></span>
      <p id="ql-busy-text">Reading your photo…</p>
    </div>
  </main>
  <script src="/quicklog.js?v=20260801-1" defer></script>
</body>
</html>
